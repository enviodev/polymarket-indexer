# ── V2 CTF Collateral Adapter (pUSD-backed position lifecycle) ──────

# Adapter lifecycle streams — ClickHouse only
type V2CtfSplit
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["stakeholder", "timestamp"]
    }
  )
{
  id: ID!                              # chainId_block_logIdx
  stakeholder: String! @index
  collateralToken: String!             # underlying collateral passed to adapter
  parentCollectionId: String!
  conditionId: String! @index
  partition: [BigInt!]!
  amount: BigInt!
  txFrom: String!                      # originating EOA
  timestamp: Int! @index
  blockNumber: Int!
  transactionHash: String!
  isNegRisk: Boolean!                  # true if via NegRiskCtfCollateralAdapter
}

type V2CtfMerge
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["stakeholder", "timestamp"]
    }
  )
{
  id: ID!
  stakeholder: String! @index
  collateralToken: String!
  parentCollectionId: String!
  conditionId: String! @index
  partition: [BigInt!]!
  amount: BigInt!
  txFrom: String!
  timestamp: Int! @index
  blockNumber: Int!
  transactionHash: String!
  isNegRisk: Boolean!
}

type V2CtfRedemption
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["redeemer", "timestamp"]
    }
  )
{
  id: ID!
  redeemer: String! @index
  collateralToken: String!
  parentCollectionId: String!
  conditionId: String! @index
  indexSets: [BigInt!]!
  payout: BigInt!
  txFrom: String!
  timestamp: Int! @index
  blockNumber: Int!
  transactionHash: String!
  isNegRisk: Boolean!
}

type V2CtfAdapterStats {
  id: ID!                              # adapter address
  totalSplits: BigInt!
  totalMerges: BigInt!
  totalRedemptions: BigInt!
  totalSplitVolume: BigInt!
  totalMergeVolume: BigInt!
  totalRedemptionPayout: BigInt!
}
