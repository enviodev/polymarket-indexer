## ============================================================
## Phase 2A: Wallet
## ============================================================

# Registry of Polymarket proxy wallets (magic-link proxies + Gnosis Safes),
# mapping each wallet to its owner EOA for user-level attribution. USDC.e
# balance tracking was dropped with the pUSD transition — live balances are
# in V2PolyUSDAccount.
type Wallet {
  id: ID!
  signer: String! @index
  type: String!
  createdAt: BigInt!
}

## ============================================================
## Phase 2B: Orderbook
## ============================================================

type MarketData {
  id: ID!
  condition: String! @index
  outcomeIndex: BigInt
  marketName: String!
  marketSlug: String! @index
  outcomes: String!
  description: String!
  image: String!
  startDate: String!
  endDate: String!
}

# The largest stream in the indexer (hundreds of millions of fills) —
# ClickHouse only. Time-leading sort: market/user queries prune via the
# monthly partition; charts and leaderboards are time-range scans.
type OrderFilledEvent
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["timestamp"]
    }
  ) {
  id: ID!
  transactionHash: String!
  timestamp: Int!
  orderHash: String!
  maker: String!
  taker: String!
  makerAssetId: String!
  takerAssetId: String!
  makerAmountFilled: BigInt!
  takerAmountFilled: BigInt!
  fee: BigInt!
}

# Append-only stream — ClickHouse only
type OrdersMatchedEvent
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["timestamp"]
    }
  ) {
  id: ID!
  timestamp: Int!
  makerAssetID: BigInt!
  takerAssetID: BigInt!
  makerAmountFilled: BigInt!
  takerAmountFilled: BigInt!
}

type Orderbook {
  id: ID!
  tradesQuantity: BigInt!
  buysQuantity: BigInt!
  sellsQuantity: BigInt!
  collateralVolume: BigInt!
  scaledCollateralVolume: BigDecimal!
  collateralBuyVolume: BigInt!
  scaledCollateralBuyVolume: BigDecimal!
  collateralSellVolume: BigInt!
  scaledCollateralSellVolume: BigDecimal!
}

type OrdersMatchedGlobal {
  id: ID!
  tradesQuantity: BigInt!
  buysQuantity: BigInt!
  sellsQuantity: BigInt!
  collateralVolume: BigInt!
  scaledCollateralVolume: BigDecimal!
  collateralBuyVolume: BigInt!
  scaledCollateralBuyVolume: BigDecimal!
  collateralSellVolume: BigInt!
  scaledCollateralSellVolume: BigDecimal!
}

