## ============================================================
## Phase 1A: Fee Module
## ============================================================

# Append-only stream — ClickHouse only (not read by handlers or the GraphQL API)
type FeeRefunded
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["refundee", "timestamp"]
    }
  ) {
  id: ID!
  orderHash: String!
  tokenId: String!
  timestamp: Int!
  refundee: String!
  feeRefunded: BigInt!
  feeCharged: BigInt!
  negRisk: Boolean!
}

