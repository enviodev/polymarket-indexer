  funder: String! @index
  amount: BigInt!
}

## ============================================================
## Phase 5: Polymarket V2 (CTF Exchange V2, PolyUSD, Rewards)
## ============================================================

# ── V2 Market Metadata (enriched via Gamma API) ─────────────────────

type V2Market {
  id: ID!                              # tokenId (decimal string)
  question: String!
  slug: String! @index
  outcomes: String!                    # JSON array e.g. '["Yes","No"]'
  outcomePrices: String!               # JSON array e.g. '["0.6","0.4"]'
  description: String!
  image: String!
  startDate: String!
  endDate: String!
  conditionId: String! @index
  fills: [V2OrderFill!]! @derivedFrom(field: "market")
  matches: [V2OrderMatch!]! @derivedFrom(field: "market")
}

# ── V2 Trading ──────────────────────────────────────────────────────

# Live product stream: Postgres serves the GraphQL feed and the V2Market
# relations; mirrored into ClickHouse (token-first sort) for analytics.
type V2OrderFill
  @index(fields: ["maker", ["timestamp", "DESC"]])
  @index(fields: ["tokenId", ["timestamp", "DESC"]])
  @storage(
    postgres: true
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["timestamp"]
    }
  )
{
  id: ID!
  orderHash: String! @index
  maker: String! @index
  taker: String! @index
  side: Int!                           # 0=BUY, 1=SELL
  tokenId: BigInt! @index              # conditional token ID
  market: V2Market                     # enriched from Gamma API
  makerAmountFilled: BigInt!
  takerAmountFilled: BigInt!
  fee: BigInt!
  builder: String! @index              # builder code (bytes32)
  metadata: String!                    # metadata (bytes32)
  exchange: String! @index             # source exchange address
  timestamp: Int! @index
  blockNumber: Int!
  transactionHash: String!
  txFrom: String!                      # transaction sender
}

type V2OrderMatch
  @index(fields: ["takerOrderMaker", ["timestamp", "DESC"]])
  @storage(
    postgres: true
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["timestamp"]
    }
  )
{
  id: ID!
  takerOrderHash: String! @index
  takerOrderMaker: String! @index
  side: Int!                           # 0=BUY, 1=SELL
  tokenId: BigInt! @index
  market: V2Market                     # enriched from Gamma API
  makerAmountFilled: BigInt!
  takerAmountFilled: BigInt!
  exchange: String! @index
  timestamp: Int! @index
  blockNumber: Int!
  transactionHash: String!
}

# Append-only stream — ClickHouse only
type V2FeeEvent
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["timestamp"]
    }
  ) {
  id: ID!
  receiver: String!
  amount: BigInt!
  timestamp: Int!
  blockNumber: Int!
  transactionHash: String!
}

# ── V2 PolyUSD ──────────────────────────────────────────────────────

# pUSD flow streams — ClickHouse only
type V2PolyUSDTransfer
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["timestamp"]
    }
  ) {
  id: ID!
  from: String!
  to: String!
  amount: BigInt!
  timestamp: Int!
  blockNumber: Int!
  transactionHash: String!
}

type V2PolyUSDWrap
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["txFrom", "timestamp"]
    }
  ) {
  id: ID!
  eventType: String!                   # "wrap" | "unwrap" | "wrap_negrisk_ctf" | "unwrap_negrisk_ctf"
  caller: String!                      # msg.sender to pUSD (often an onramp contract)
  asset: String!                       # underlying asset (USDC or USDC.e)
  to: String!                          # recipient of the wrapped token
  txFrom: String!                      # originating EOA that initiated the tx
  amount: BigInt!
  timestamp: Int!
  blockNumber: Int!
  transactionHash: String!
}

type V2PolyUSDAccount {
  id: ID!                              # address
  balance: BigInt!
  totalWrapped: BigInt!
  totalUnwrapped: BigInt!
}

# ── V2 Rewards ──────────────────────────────────────────────────────

# Append-only stream — ClickHouse only
type V2RewardDistribution
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["user", "timestamp"]
    }
  ) {
  id: ID!
  user: String!
  amount: BigInt!
  timestamp: Int!
  blockNumber: Int!
  transactionHash: String!
}

type V2SponsoredMarket {
  id: ID!                              # marketId (bytes32)
  startTime: Int!
  minSponsorDuration: Int!
  minSponsorAmount: BigInt!
  marketData: String!
  closed: Boolean! @index
  closedAt: Int
  createdAt: Int! @index
  createdAtBlock: Int!
}

type V2Sponsorship
  @index(fields: ["sponsor", ["timestamp", "DESC"]])
  @index(fields: ["market", ["timestamp", "DESC"]])
{
  id: ID!                              # txHash-logIndex
  market: V2SponsoredMarket!
  sponsor: String! @index
  amount: BigInt!
  startTime: Int!
  endTime: Int!
  ratePerMinute: BigInt!
  withdrawn: Boolean!
  returnedAmount: BigInt
  consumedAmount: BigInt
  isEarlyWithdraw: Boolean
  timestamp: Int! @index
  blockNumber: Int!
}

