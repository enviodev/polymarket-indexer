enum TransactionType {
  Buy
  Sell
}

# FPMM (legacy AMM era) append-only streams — ClickHouse only
type FpmmTransaction
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["user", "timestamp"]
    }
  ) {
  id: ID!
  type: TransactionType!
  timestamp: Int!
  market_id: String!
  user: String!
  tradeAmount: BigInt!
  feeAmount: BigInt!
  outcomeIndex: BigInt!
  outcomeTokensAmount: BigInt!
}

type FpmmFundingAddition
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["funder", "timestamp"]
    }
  ) {
  id: ID!
  timestamp: Int!
  fpmm_id: String!
  funder: String!
  amountsAdded: [BigInt!]!
  amountsRefunded: [BigInt!]!
  sharesMinted: BigInt!
}

type FpmmFundingRemoval
  @storage(
    clickhouse: {
      partitionBy: "toYYYYMM(toDateTime(timestamp))"
      orderBy: ["funder", "timestamp"]
    }
  ) {
  id: ID!
  timestamp: Int!
  fpmm_id: String!
  funder: String!
